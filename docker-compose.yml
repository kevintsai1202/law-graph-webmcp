services:
  app:
    build: { context: ., dockerfile: docker/app/Dockerfile }
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL: ${MODEL:-gpt-5.4-nano}
      LEGAL_MCP_URL: http://legal-mcp:8000
      LAWGRAPH_SKILLS_DIR: /app/skills
    ports: ["8080:8080"]
    depends_on:
      legal-mcp: { condition: service_healthy }
  legal-mcp:
    build: docker/legal-mcp
    volumes: [legal-cache:/usr/local/lib/python3.12/site-packages/mcp_server/data]
  # Quick Tunnel（trycloudflare.com）：免網域、免 token，但網址每次重啟都會變；
  # 改用固定網域時換成：command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on: [app]
volumes:
  legal-cache:
