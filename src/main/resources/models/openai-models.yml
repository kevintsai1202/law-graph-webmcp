# ============================================
# models/openai-models.yml（專案自帶，遮蔽 Embabel 1.5.1 內建同名檔）
# ============================================
# Embabel 的 OpenAiModelLoader 固定讀 classpath:models/openai-models.yml；
# Spring Boot 的 BOOT-INF/classes 排在依賴 jar 之前，因此這份檔案會優先被載入。
# 目的：讓 OpenAI 相容端點（Meta Muse，OPENAI_BASE_URL=https://api.meta.ai/v1）
# 上的模型能被 MODEL 環境變數選到；同時保留 gpt-5.4-mini／nano，切回 OpenAI 只需改環境變數。
# 注意：這裡不定義 embedding 模型（本專案沒有用到），避免啟動時對 Meta 端點做 embedding 探測。

native_support_defaults:
  structured_output:
    # Meta Muse 已實測接受 response_format=json_schema（2026-09-04），沿用 OpenAI 的原生結構化輸出。
    supported: true
    strategy: "response_format"
    strict: false
    prompt_instructions: "include"
    options:
      response_format_field: "response_format"
      type_field: "type"
      type_value: "json_schema"
      json_schema_field: "json_schema"
      name_field: "name"
      schema_field: "schema"
      strict_field: "strict"

models:
  # ========================================
  # META MUSE（OpenAI 相容 Chat Completions；reasoning 模型）
  # 實測：json_schema、function calling、image_url 皆 200；
  # reasoning_tokens 會佔用 completion 額度，max_tokens 過小時 content 為 null，
  # 因此上限放到 16384 並以 max_completion_tokens 送出。價格未公開，先記 0。
  # ========================================

  - name: "musespark13contributor"
    model_id: "muse-spark-1.3-contributor"
    api_format: "CHAT_COMPLETIONS"
    display_name: "Meta Muse Spark 1.3 (contributor)"
    max_tokens: 16384
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 0.0
      usd_per1m_output_tokens: 0.0
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true

  - name: "musespark13"
    model_id: "muse-spark-1.3"
    api_format: "CHAT_COMPLETIONS"
    display_name: "Meta Muse Spark 1.3"
    max_tokens: 16384
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 0.0
      usd_per1m_output_tokens: 0.0
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true

  # ========================================
  # OPENAI 後備（與 Embabel 內建定義相同，切回 api.openai.com 時使用）
  # ========================================

  - name: "gpt54mini"
    model_id: "gpt-5.4-mini"
    display_name: "GPT-5.4 Mini"
    max_tokens: 16384
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 0.750
      usd_per1m_output_tokens: 4.500
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true

  - name: "gpt54nano"
    model_id: "gpt-5.4-nano"
    display_name: "GPT-5.4 Nano"
    max_tokens: 8192
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 0.20
      usd_per1m_output_tokens: 1.25
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true
