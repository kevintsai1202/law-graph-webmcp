<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1e3a8a">
  <title>Law Graph</title>
  <!-- 字體：標題 EB Garamond／Noto Serif TC，內文 Inter／Noto Sans TC；display=swap 避免隱形文字，離線時退回系統字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <!-- WebMCP 工具層獨立 bundle（npm run bundle 由 js/webmcp-entry.js 打包）：於 <head> 同步載入、不加 defer，
       頁面一開始就把工具註冊給 Agent host（ChatGPT／Codex Site tools 只在載入初期掃描一次）；
       應用層 app-bundle.js 載入後再經 window.__webmcpBoot.bind() 接上真正的 app。 -->
  <script src="js/webmcp-bundle.js"></script>
</head>
<body>
  <a class="skip-link" href="#stage" data-i18n="a11y.skip">Skip to main content</a>
  <!-- 使用授權公告（與 law-powers 技能介紹頁相同）：無償授權所有人使用，唯經兆國際法律事務所除外 -->
  <div class="license-banner" role="note" aria-label="使用授權聲明">
    📜 <strong data-i18n="license.banner.title">使用授權</strong><span data-i18n="license.banner.prefix">：本站無償授權所有人自由使用 —— 唯 </span><span class="banner-except">經兆國際法律事務所</span><span data-i18n="license.banner.suffix"> 除外。拜他們所賜，才有這個服務的誕生。</span>
  </div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <!-- 天平：法律的權衡（SVG 圖示，不用 emoji） -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M5 21h14M12 6l-6 3 6-3 6 3-6-3"/><path d="M3 14a3 3 0 0 0 6 0L6 9l-3 5zM15 14a3 3 0 0 0 6 0l-3-5-3 5z"/>
        </svg>
      </span>
      <a class="brand-link" href="#/" data-i18n-aria="nav.home" aria-label="回首頁"><div><h1 data-i18n="app.title">Law Graph</h1><p data-i18n="app.subtitle"></p></div></a>
    </div>
    <div class="topbar-right">
      <!-- 選單常駐入口：安裝 Law Powers 技能用自己的 Agent 分析，不受本站每日額度限制 -->
      <a id="lawpowers-link" class="nav-link" href="https://kevintsai1202.github.io/law-powers/" target="_blank" rel="noopener" data-i18n="nav.lawPowers">Law Powers skills</a>
      <!-- 站台使用統計（唯讀彙總，不含個資） -->
      <a id="stats-link" class="nav-link internal" href="#/stats" data-i18n="nav.stats">Stats</a>
      <span id="semantic-badge" class="badge" role="status" style="display:none"></span>
      <span id="agent-badge" class="badge" role="status" data-i18n="agent.unavailable"></span>
      <!-- Google 登入區放最右側：未登入顯示登入與好處，登入後顯示頭像；後端未設定時保持空白。語系由瀏覽器語言決定，不再提供切換 -->
      <div id="auth-slot" class="auth-slot"></div>
    </div>
  </header>
  <div id="privacy-slot"></div>
  <main id="stage" tabindex="-1"><p role="status">正在載入 / Loading…</p></main>
  <!-- 3D 依賴由結果頁按需載入，避免大型腳本阻塞首頁與登入入口。 -->
  <!-- 應用層改用單一 classic script（npm run bundle 由 js/main.js 打包）：
       避免 type="module" 的延遲載入／模組隔離造成部分 Agent host（Site tools）偵測不到工具註冊。
       js/*.js 模組原始碼仍為單一事實來源，node 測試直接吃模組；改碼後須重跑 npm run bundle。 -->
  <script defer src="js/app-bundle.js"></script>
</body>
</html>
